<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Tiny Tasks</h1>
    <p id="mcp-status" class="status">Checking for WebMCP…</p>
  </header>

  <main>
    <section class="card">
      <h2>Add a task</h2>
      <!-- Declarative WebMCP: the browser exposes this form as a tool -->
      <form id="add-form"
            toolname="add_task_form"
            tooldescription="Add a new task to the list using the form on the page."
            toolautosubmit>
        <input name="title" placeholder="What needs doing?" required
               toolparamdescription="Short title of the task">
        <select name="priority" toolparamdescription="Task priority: low, normal or high">
          <option value="low">Low</option>
          <option value="normal" selected>Normal</option>
          <option value="high">High</option>
        </select>
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="card">
      <div class="row">
        <h2>Tasks</h2>
        <span id="count" class="muted"></span>
      </div>
      <ul id="task-list"></ul>
      <p id="empty" class="muted">No tasks yet. Add one, or ask Claude to.</p>
    </section>

    <section class="card">
      <h2>Agent activity</h2>
      <ol id="log" class="log"></ol>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
